name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to rebuild, for example v0.1.10"
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Verify and package
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-rust

      - name: Validate release tag
        run: |
          case "$RELEASE_TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "Release tag must look like vX.Y.Z, got: $RELEASE_TAG" >&2
              exit 1
              ;;
          esac

          cargo_version="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json, sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          tag_version="${RELEASE_TAG#v}"
          if [ "$cargo_version" != "$tag_version" ]; then
            echo "Cargo.toml version $cargo_version does not match tag $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run release tests
        run: cargo test --locked --release --all-targets --all-features

      - name: Restore cargo-bundle cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-bundle
          key: cargo-bundle-${{ runner.os }}-${{ runner.arch }}-0.11.0

      - name: Install cargo-bundle
        run: |
          if ! command -v cargo-bundle >/dev/null 2>&1; then
            cargo install cargo-bundle --version 0.11.0 --locked
          fi

      - name: Install uv for DMG packaging
        uses: astral-sh/setup-uv@v10.0.1

      - name: Build app bundle
        run: |
          cargo bundle --release --all-features --format osx
          APP="target/release/bundle/osx/ProxyBear.app"
          test -d "$APP"
          plutil -lint "$APP/Contents/Info.plist"

      - name: Ad-hoc code sign and build installation image
        run: |
          VERSION="${RELEASE_TAG#v}"
          APP="target/release/bundle/osx/ProxyBear.app"
          APP_ZIP="target/release/bundle/ProxyBear-${VERSION}.app.zip"
          DMG="target/release/bundle/dmg/ProxyBear-${VERSION}.dmg"
          codesign --remove-signature "$APP/Contents/MacOS/proxybear" 2>/dev/null || true
          codesign --force --deep --sign - "$APP"
          rm -rf target/release/bundle/dmg
          mkdir -p target/release/bundle/dmg
          uvx --from dmgbuild==1.6.7 dmgbuild \
            -s bundle/dmg-settings.py \
            -D app="$APP" \
            "Install ProxyBear" "$DMG"
          ditto -c -k --keepParent "$APP" "$APP_ZIP"
          (
            cd target/release/bundle
            shasum -a 256 "ProxyBear-${VERSION}.app.zip" "dmg/ProxyBear-${VERSION}.dmg" > SHA256SUMS
          )
          test -f "$APP_ZIP"
          test -f "$DMG"
          test -f target/release/bundle/SHA256SUMS

      - name: Verify installation image
        run: |
          DMG="target/release/bundle/dmg/ProxyBear-${RELEASE_TAG#v}.dmg"
          hdiutil verify "$DMG"
          DMG_MOUNT="$(mktemp -d)"
          trap 'hdiutil detach "$DMG_MOUNT" >/dev/null 2>&1 || true; rmdir "$DMG_MOUNT"' EXIT
          hdiutil attach -readonly -nobrowse -noautoopen -mountpoint "$DMG_MOUNT" "$DMG"
          test -d "$DMG_MOUNT/ProxyBear.app"
          test "$(readlink "$DMG_MOUNT/Applications")" = /Applications
          test -f "$DMG_MOUNT/.DS_Store"
          test -f "$DMG_MOUNT/.background.tiff"
          codesign --verify --deep --strict "$DMG_MOUNT/ProxyBear.app"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ProxyBear-${{ env.RELEASE_TAG }}-release-artifacts
          path: |
            target/release/bundle/ProxyBear-*.app.zip
            target/release/bundle/dmg/ProxyBear-*.dmg
            target/release/bundle/SHA256SUMS
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download verified artifacts
        uses: actions/download-artifact@v8
        with:
          name: ProxyBear-${{ env.RELEASE_TAG }}-release-artifacts
          path: release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            release/ProxyBear-*.app.zip
            release/dmg/ProxyBear-*.dmg
            release/SHA256SUMS
          generate_release_notes: true
          fail_on_unmatched_files: true

  update-tap:
    name: Update Homebrew tap
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: homebrew-tap-update
      cancel-in-progress: false

    steps:
      - name: Checkout Homebrew tap
        uses: actions/checkout@v7
        with:
          repository: msdx321/homebrew-tap
          ref: main
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}

      - uses: astral-sh/setup-uv@v10.0.1

      - name: Update cask from the published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run --no-project --python 3.13 .github/scripts/update-proxybear.py
          if git diff --quiet -- Casks/proxybear.rb; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Casks/proxybear.rb
          git commit -m 'chore(cask): update ProxyBear release'
          git push
