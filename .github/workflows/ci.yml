name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: macos-26
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-rust-release
          cache-bin: false
          save-if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Run clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Build executable
        run: cargo build --locked --all-features

      # Release tags can restore default-branch caches, but not other tags' caches.
      - name: Warm release build cache
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: cargo build --locked --release --all-features
