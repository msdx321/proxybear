[package]
name = "proxybear"
version = "1.0.0"
edition = "2024"
description = "Native macOS menu-bar SSH SOCKS proxy."

[dependencies]
anyhow = "1.0"
auto-launch = "0.6.0"
directories = "6.0"
futures = { version = "0.3", default-features = false, features = ["std"] }
gpui = { package = "gpui-pre", version = "0.3.4", default-features = false }
gpui-component = "0.6.0"
gpui-platform = { package = "gpui-pre-platform", version = "0.3.4", features = ["font-kit", "runtime_shaders"] }
native-dialog = "0.9.7"
objc2 = "0.6.4"
open = "5.3.6"
russh = "0.63.1"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.52", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
toml = "1.0"
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "tracing-log"] }
tray-icon = { version = "0.24.1", default-features = false }

[build-dependencies]
resvg = { version = "0.48.1", default-features = false }

[package.metadata.bundle]
name = "ProxyBear"
identifier = "com.msdx321.proxybear"
icon = ["bundle/ProxyBear.icns"]
category = "public.app-category.utilities"
short_description = "Menu-bar SSH SOCKS proxy."
long_description = "A native macOS menu-bar app that runs an unauthenticated local SOCKS proxy over SSH."
osx_minimum_system_version = "11.0"
osx_info_plist_exts = ["bundle/macos-info.plist"]
